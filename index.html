<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e0b">
<title>VFX BOOTH 受信</title>
<link rel="stylesheet" href="m3.css">
<style>
body { background: radial-gradient(700px 400px at 50% -10%, rgba(98,245,143,.10), transparent 60%), var(--surface); padding-bottom: 40px; }
.bar { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--outline-variant); }
.logo { width: 32px; height: 32px; border-radius: 9px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; box-shadow: 0 0 20px rgba(98,245,143,.4); }
.bar .title-m { letter-spacing: .12em; font-weight: 700; }
main { max-width: 560px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.howto { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.howto div { background: var(--sc); border: 1px solid var(--outline-variant); border-radius: var(--r-m); padding: 10px; font-size: 12px; line-height: 16px; font-weight: 600; }
.howto b { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--primary-container); color: var(--on-primary-container); font-family: var(--mono); font-size: 11px; margin-bottom: 6px; }
.cam { position: relative; border-radius: var(--r-l); overflow: hidden; background: #000; aspect-ratio: 4/3; border: 1px solid var(--outline-variant); }
.cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
.cam .guide { position: absolute; inset: 12% 12%; border: 2px solid var(--primary); border-radius: var(--r-m); box-shadow: 0 0 0 999px rgba(0,0,0,.35); pointer-events: none; }
.cam .ph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--on-surface-variant); }
.stat { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(18px, 1fr)); gap: 4px; margin-top: 12px; }
.grid i { aspect-ratio: 1; border-radius: 4px; background: var(--sc-highest); transition: background .15s; }
.grid i.on { background: var(--primary); box-shadow: 0 0 8px rgba(98,245,143,.5); }
.prog { height: 6px; border-radius: 3px; background: var(--sc-highest); overflow: hidden; margin-top: 10px; }
.prog > div { height: 100%; width: 0; background: var(--primary); transition: width .15s; }
.done { text-align: center; }
.done img { width: 100%; border-radius: var(--r-l); display: block; border: 1px solid var(--outline-variant); -webkit-touch-callout: default; }
.row { display: flex; flex-direction: column; gap: 10px; }
.btn { height: 48px; width: 100%; }
</style>
</head>
<body>
<div class="bar"><span class="logo"><i data-ic="movie"></i></span><span class="title-m">VFX BOOTH</span></div>
<main>
  <div id="scan" class="row">
    <div class="howto">
      <div><b>1</b>下の「読み取りスタート」を押す</div>
      <div><b>2</b>PCの画面のパラパラQRにカメラを向ける</div>
      <div><b>3</b>全部集まるまで動かさず待つ</div>
    </div>
    <div class="cam">
      <video id="v" playsinline muted></video>
      <div class="guide" id="guide" hidden></div>
      <div class="ph" id="ph"><div><div class="title-m" style="color:var(--on-surface)">ここにカメラの映像が出ます</div></div></div>
    </div>
    <div class="card">
      <div class="stat"><div class="title-m" id="msg">準備OK</div><div class="label-l mono" id="cnt" style="color:var(--primary)"></div></div>
      <div class="prog"><div id="bar"></div></div>
      <div class="grid" id="grid"></div>
    </div>
    <button id="start" class="btn filled has-icon"><i data-ic="camera"></i>読み取りスタート</button>
    <button id="photoBtn" class="btn tonal has-icon"><i data-ic="image"></i>写真で読み取る(うまくいかない時)</button>
    <input id="file" type="file" accept="image/*" capture="environment" hidden>
    <a id="https" class="btn outlined" hidden>HTTPS版に切り替える</a>
  </div>
  <div id="result" class="done" hidden>
    <div class="chip ok" style="margin-bottom:12px">全部集まりました</div>
    <img id="img" alt="受け取った写真">
    <p class="body-m muted" style="margin:10px 0">写真を長押しして「写真に追加」でも保存できます</p>
    <div class="row">
      <a id="dl" class="btn filled has-icon" download="vfx"><i data-ic="download"></i>保存する</a>
      <button id="share" class="btn tonal has-icon" hidden><i data-ic="share"></i>共有・写真に追加</button>
      <button id="again" class="btn outlined has-icon"><i data-ic="replay"></i>次の写真を受け取る</button>
    </div>
  </div>
</main>
<div id="snack"></div>
<script src="vendor/jsQR.js"></script>
<script src="common.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
VFX.hydrateIcons();
const v = $('#v');
let stream = null, running = false, sess = null, tot = 0, crc = 0, got = new Map(), blobUrl = null;
const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });

function snack(m) { const e = $('#snack'); e.textContent = m; e.classList.add('show'); clearTimeout(snack.t); snack.t = setTimeout(() => e.classList.remove('show'), 2800); }
function resetState() {
  sess = null; got = new Map(); tot = 0; $('#grid').innerHTML = ''; $('#bar').style.width = '0'; $('#cnt').textContent = '';
  $('#msg').textContent = 'QRを探しています…';
}
function onChunk(bytes) {
  const c = VFX.parseChunk(bytes); if (!c) return false;
  if (c.sess !== sess) { resetState(); sess = c.sess; tot = c.tot; crc = c.crc; $('#grid').innerHTML = '<i></i>'.repeat(tot); }
  if (!got.has(c.idx)) {
    got.set(c.idx, c.data);
    $('#grid').children[c.idx].classList.add('on');
    $('#cnt').textContent = `${got.size} / ${tot}`;
    $('#bar').style.width = (got.size / tot * 100) + '%';
    $('#msg').textContent = '読み取り中… カメラを動かさないで';
    if (navigator.vibrate) navigator.vibrate(8);
    if (got.size === tot) finish();
  }
  return true;
}
function finish() {
  const bytes = VFX.assemble(got, tot);
  if (VFX.crc32(bytes) !== crc) { snack('うまくつながらなかったのでやり直します'); resetState(); return; }
  const mime = VFX.sniffMime(bytes), blob = new Blob([bytes], { type: mime });
  if (blobUrl) URL.revokeObjectURL(blobUrl); blobUrl = URL.createObjectURL(blob);
  $('#img').src = blobUrl; $('#dl').href = blobUrl; $('#dl').download = 'vfx.' + (mime === 'image/webp' ? 'webp' : mime === 'image/png' ? 'png' : 'jpg');
  const f = new File([blob], $('#dl').download, { type: mime });
  $('#share').hidden = !(navigator.canShare && navigator.canShare({ files: [f] }));
  $('#share').onclick = () => navigator.share({ files: [f] }).catch(() => {});
  stopCam(); $('#scan').hidden = true; $('#result').hidden = false;
}
function stopCam() { running = false; if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; v.srcObject = null; $('#guide').hidden = true; $('#ph').hidden = false; }

async function startCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { snack('この接続ではカメラが使えません。「写真で読み取る」を使ってください'); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  } catch (e) { snack('カメラを許可してください (' + (e.name || e) + ')'); return; }
  v.srcObject = stream; await v.play(); $('#ph').hidden = true; $('#guide').hidden = false;
  resetState(); running = true; loop();
}
let lastT = 0;
function loop(ts = 0) {
  if (!running) return;
  if (ts - lastT > 50 && v.videoWidth) {
    lastT = ts;
    const sc = Math.min(1, 1100 / v.videoWidth); cv.width = Math.round(v.videoWidth * sc); cv.height = Math.round(v.videoHeight * sc);
    cx.drawImage(v, 0, 0, cv.width, cv.height);
    const d = cx.getImageData(0, 0, cv.width, cv.height);
    const r = jsQR(d.data, d.width, d.height, { inversionAttempts: 'dontInvert' });
    if (r && r.binaryData) onChunk(r.binaryData);
  }
  requestAnimationFrame(loop);
}
$('#start').onclick = startCam;
$('#again').onclick = () => { $('#result').hidden = true; $('#scan').hidden = false; resetState(); startCam(); };
$('#photoBtn').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return; e.target.value = '';
  const bmp = await createImageBitmap(f), sc = Math.min(1, 2000 / bmp.width);
  cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc); cx.drawImage(bmp, 0, 0, cv.width, cv.height);
  const d = cx.getImageData(0, 0, cv.width, cv.height), r = jsQR(d.data, d.width, d.height);
  if (r && r.binaryData && onChunk(r.binaryData)) snack('1枚読み取れました。続けて撮ってください'); else snack('QRが読めませんでした。もう一度');
};
if (!window.isSecureContext && location.protocol === 'http:') {
  const a = $('#https'); a.hidden = false;
  fetch('/info.json').then(r => r.json()).then(i => { a.href = `https://${location.hostname}:${i.https}/receive.html`; }).catch(() => { a.hidden = true; });
}
</script>
</body>
</html>

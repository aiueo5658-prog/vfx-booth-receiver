<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>VFX BOOTH 受信</title>
<link rel="stylesheet" href="m3.css?v=202610291711">
<style>
body { background: var(--canvas); padding-bottom: 40px; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px; background: rgba(255,255,255,.8); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(0,0,0,.08); }
.bar .title-m { font-size: 17px; letter-spacing: -.02em; }
main { max-width: 560px; margin: 0 auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.cam { position: relative; border-radius: var(--r-xl); overflow: hidden; background: var(--surface); aspect-ratio: 3/4; }
.cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
.cam .guide { position: absolute; inset: 10% 8%; border: 2px dashed rgba(255,255,255,.7); border-radius: var(--r-m); box-shadow: 0 0 0 999px rgba(0,0,0,.32); pointer-events: none; transition: border-color .15s; }
.cam .guide.hit { border: 3px solid var(--primary); box-shadow: 0 0 0 999px rgba(0,0,0,.32), 0 0 0 6px rgba(0,113,227,.3); }
.cam .ph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
.cam .hint { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 10px 14px; border-radius: 999px; background: rgba(29,29,31,.72); backdrop-filter: blur(20px); color: #fff; font-size: 14px; font-weight: 600; text-align: center; }
.stat { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(16px, 1fr)); gap: 4px; margin-top: 12px; }
.grid i { aspect-ratio: 1; border-radius: 3px; background: var(--sc-highest); transition: background .15s; }
.grid i.on { background: var(--primary); }
.prog { height: 4px; border-radius: 2px; background: var(--sc-highest); overflow: hidden; margin-top: 10px; }
.prog > div { height: 100%; width: 0; background: var(--primary); transition: width .15s; }
.done { text-align: center; }
.done img { width: 100%; border-radius: var(--r-xl); display: block; -webkit-touch-callout: default; }
.row { display: flex; flex-direction: column; gap: 10px; }
.btn { height: 50px; width: 100%; }
.diag { margin-top: 10px; font: 400 11px/16px var(--mono); color: var(--muted, #6e6e73); letter-spacing: .02em; }
.ph .display { color: var(--ink); }
</style>
</head>
<body>
<div class="bar"><svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#1D1D1F" stroke-width="2.4"/><circle cx="16" cy="16" r="5" fill="#0071E3"/></svg><span class="title-m">VFX BOOTH</span></div>
<main>
  <div id="scan" class="row">
    <div class="cam">
      <video id="v" playsinline muted></video>
      <div class="guide" id="guide" hidden></div>
      <div class="ph" id="ph"><div><div class="display" style="font-size:30px">QRを読む</div><div class="body-m muted" style="margin-top:10px">PCのパラパラQRに<br>カメラを向けます</div></div></div>
      <div class="hint" id="hint" hidden></div>
    </div>
    <div class="card">
      <div class="stat"><div class="title-m" id="msg">準備OK</div><div class="label-l mono" id="cnt" style="color:var(--primary)"></div></div>
      <div class="prog"><div id="bar"></div></div>
      <div class="grid" id="grid"></div>
      <div class="diag" id="diag"></div>
    </div>
    <button id="start" class="btn filled"><i data-ic="camera"></i>読み取りスタート</button>
  </div>
  <div id="result" class="done" hidden>
    <div class="chip ok" style="margin-bottom:12px">DONE · 全部集まりました</div>
    <img id="img" alt="受け取った写真">
    <p class="body-m muted" style="margin:10px 0">写真を長押しして「写真に追加」でも保存できます</p>
    <div class="row">
      <a id="dl" class="btn filled" download="vfx"><i data-ic="download"></i>保存する</a>
      <button id="share" class="btn tonal" hidden><i data-ic="share"></i>共有・写真に追加</button>
      <button id="again" class="btn outlined"><i data-ic="replay"></i>次の写真を受け取る</button>
    </div>
  </div>
</main>
<div id="snack"></div>
<script src="vendor/zbar.js?v=202610291711"></script>
<script src="vendor/jsQR.js?v=202610291711"></script>
<script src="common.js?v=202610291711"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
VFX.hydrateIcons();
const v = $('#v');
let stream = null, running = false, dec = null, blobUrl = null, lastHit = 0, lastNew = 0, startedAt = 0;
const RECV_VER = '202610291711';
let nScan = 0, nCode = 0, nOther = 0, rateT = performance.now(), rate = 0, lastOther = '';
const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
// 読み取りは ZBar(WebAssembly)。ぼけ・ノイズ・傾きに強い。読み込めない時だけ jsQR に切り替える。
let useZbar = typeof zbarWasm !== 'undefined';

function snack(m) { const e = $('#snack'); e.textContent = m; e.classList.add('show'); clearTimeout(snack.t); snack.t = setTimeout(() => e.classList.remove('show'), 2800); }
function resetState() {
  dec = null; $('#grid').innerHTML = ''; $('#bar').style.width = '0'; $('#cnt').textContent = '';
  $('#msg').textContent = 'QRを探しています…'; lastNew = performance.now();
}
function onText(text) {
  nCode++;
  const f = VFX.parseFrame(text);
  if (!f) { nOther++; lastOther = /^https?:/.test(text) ? 'URL(QR①)' : (text.slice(0, 4) === 'VFX1' || text.charCodeAt(0) === 0x56 && text.charCodeAt(1) === 0x32 ? '古い形式' : '別のQR'); return; }
  lastHit = performance.now();
  if (!dec || dec.sess !== f.sess) {
    resetState(); dec = new VFX.Decoder(f);
    $('#grid').innerHTML = '<i></i>'.repeat(Math.min(f.K, 400));
  }
  if (dec.add(f)) {
    lastNew = performance.now();
    const cells = $('#grid').children;
    for (let i = 0; i < cells.length; i++) cells[i].classList.toggle('on', i < dec.n);
    $('#cnt').textContent = `${dec.n} / ${dec.K}`;
    $('#bar').style.width = (dec.n / dec.K * 100) + '%';
    $('#msg').textContent = '読み取り中… そのまま';
    if (navigator.vibrate) navigator.vibrate(6);
    if (dec.done) finish();
  }
}
function finish() {
  const bytes = dec.result();
  if (!bytes) { snack('うまくつながらなかったのでやり直します'); resetState(); return; }
  const mime = VFX.sniffMime(bytes), blob = new Blob([bytes], { type: mime });
  if (blobUrl) URL.revokeObjectURL(blobUrl); blobUrl = URL.createObjectURL(blob);
  const ext = mime === 'image/webp' ? 'webp' : mime === 'image/png' ? 'png' : 'jpg';
  $('#img').src = blobUrl; $('#dl').href = blobUrl; $('#dl').download = 'vfx.' + ext;
  const f = new File([blob], 'vfx.' + ext, { type: mime });
  $('#share').hidden = !(navigator.canShare && navigator.canShare({ files: [f] }));
  $('#share').onclick = () => navigator.share({ files: [f] }).catch(() => {});
  stopCam(); $('#scan').hidden = true; $('#result').hidden = false;
}
function stopCam() { running = false; if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; v.srcObject = null; $('#guide').hidden = true; $('#hint').hidden = true; $('#ph').hidden = false; }

async function startCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { snack('この接続ではカメラが使えません'); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  } catch (e) { snack('カメラを許可してください (' + (e.name || e) + ')'); return; }
  try { await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
  v.srcObject = stream; await v.play(); $('#ph').hidden = true; $('#guide').hidden = false;
  resetState(); startedAt = performance.now(); running = true; loop();
}
function hint() {
  const now = performance.now(), h = $('#hint'), g = $('#guide');
  g.classList.toggle('hit', now - lastHit < 400);
  let t = '';
  if (!dec) t = now - startedAt > 8000 ? 'QRが見つかりません。PCの画面を明るくして、枠いっぱいに' : now - startedAt > 3000 ? '少し離して、QR全体を枠に入れて' : '';
  else if (now - lastNew > 2500) t = 'QRが読めていません。距離とピントを調整して';
  if (!dec && nOther > 3 && lastOther === '古い形式') t = 'ページが古いです。再読み込みしてください';
  else if (!dec && nOther > 3 && lastOther === 'URL(QR①)') t = '大きい方のQR②を写してください';
  if (now - rateT > 1000) { rate = Math.round(nScan * 1000 / (now - rateT)); nScan = 0; rateT = now; }
  $('#diag').textContent = `${useZbar ? 'ZBar' : 'jsQR'} · ${rate}回/秒 · ${v.videoWidth}x${v.videoHeight} · QR認識 ${nCode}` + (nOther ? ` (対象外 ${nOther}: ${lastOther})` : '') + ` · v${RECV_VER}`;
  h.hidden = !t; h.textContent = t;
}
let busy = false;
async function loop() {
  if (!running) return;
  if (!busy && v.videoWidth) {
    busy = true;
    try {
      // 交互に「全体を縮小」「中央を等倍で切り出し」して読む(等倍の方が1マスが大きく写る)
      const vw = v.videoWidth, vh = v.videoHeight, crop = (nScan & 1) === 1;
      if (crop) {
        const side = Math.round(Math.min(vw, vh) * 0.8), sx = (vw - side) >> 1, sy = (vh - side) >> 1, out = Math.min(side, 1100);
        cv.width = cv.height = out; cx.drawImage(v, sx, sy, side, side, 0, 0, out, out);
      } else {
        const sc = Math.min(1, 1280 / vw); cv.width = Math.round(vw * sc); cv.height = Math.round(vh * sc);
        cx.drawImage(v, 0, 0, cv.width, cv.height);
      }
      nScan++;
      const d = cx.getImageData(0, 0, cv.width, cv.height);
      if (useZbar) {
        const syms = await zbarWasm.scanImageData(d);
        syms.forEach(y => onText(y.decode()));
      } else {
        const r = jsQR(d.data, d.width, d.height, { inversionAttempts: 'dontInvert' });
        if (r && r.data) onText(r.data);
      }
    } catch (e) { useZbar = false; }   // ZBarが動かない端末では jsQR に切り替える
    busy = false;
  }
  hint();
  requestAnimationFrame(loop);
}
$('#start').onclick = startCam;
$('#again').onclick = () => { $('#result').hidden = true; $('#scan').hidden = false; resetState(); startCam(); };
</script>
</body>
</html>
